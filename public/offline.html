<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a11" />
    <title>Офлайн — Raf&lt;/&gt;Console Studio</title>
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main>
      <div class="signal" aria-hidden="true"><span></span></div>
      <p class="eyebrow" id="eyebrow">Raf&lt;/&gt;Console Studio · Офлайн</p>
      <h1 id="title">Нет подключения</h1>
      <p class="lead" id="lead">
        Интернет недоступен, но два важных раздела уже сохранены на устройстве и продолжат работать.
      </p>

      <nav class="cards" aria-label="Доступные офлайн-разделы">
        <a class="card" id="bored-link" href="/bored_ru">
          <strong id="bored-title">От скуки</strong>
          <span id="bored-description">Полноэкранная игра, AIM-тренировка и все сохранённые звуки.</span>
        </a>

        <a class="card" id="policy-link" href="/privacy_policy_ru">
          <strong id="policy-title">Политика</strong>
          <span id="policy-description">Политика конфиденциальности доступна даже без сети.</span>
        </a>
      </nav>

      <button class="retry" id="retry" type="button">Проверить подключение</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script src="/offline.js" defer></script>
  </body>
</html>
